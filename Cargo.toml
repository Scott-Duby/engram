[workspace]
resolver = "3"
members = ["crates/cortex", "crates/synapse", "crates/brain-cli", "apps/companion/src-tauri"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Scott-Duby/engram"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
