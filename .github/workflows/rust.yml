name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Format
      run: cargo fmt --check
    # brain-app (Tauri) is skipped until it gets its own job with yarn build
    - name: Clippy
      run: cargo clippy --workspace --all-targets --exclude brain-app -- -D warnings
    - name: Test
      run: cargo test --workspace --exclude brain-app
